<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mellstroy Tap</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background: #0f0f13;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      user-select: none;
      overflow: hidden;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .title {
      font-size: 20px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .score {
      font-size: 48px;
      font-weight: 900;
      color: #2ec4b6;
      text-shadow: 0 0 15px rgba(46, 196, 182, 0.5);
    }
    .coin-container {
      position: relative;
    }
    .coin {
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, #2ec4b6 0%, #0f172a 100%);
      border: 4px solid #2ec4b6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 90px;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(46, 196, 182, 0.3);
      transition: transform 0.05s ease;
    }
    .coin:active {
      transform: scale(0.93);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">Баланс Борова</div>
    <div class="score" id="score">0</div>
  </div>

  <div class="coin-container">
    <div class="coin" id="coinBtn">💸</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let count = 0;
    const scoreEl = document.getElementById('score');
    const coinBtn = document.getElementById('coinBtn');

    coinBtn.addEventListener('click', (e) => {
      count += 1;
      scoreEl.innerText = count.toLocaleString();

      if (tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('medium');
      }

      if (count % 10 === 0) {
        saveProgress(count);
      }
    });

    function saveProgress(clicks) {
      fetch('/api/tap', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ clicks: clicks })
      });
    }
  </script>
</body>
</html>
