<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MellTap</title>
    <!-- Подключаем скрипт Telegram WebApp со сбросом кэша -->
    <script src="https://telegram.org/js/telegram-web-app.js?v=4"></script>
    <style>
        body {
            background-color: #0d0f12;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        h2 {
            font-size: 18px;
            letter-spacing: 2px;
            color: #8a939e;
            margin-bottom: 5px;
        }

        .score {
            font-size: 48px;
            font-weight: bold;
            color: #00f2fe;
            margin-bottom: 40px;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        /* Кнопка-кликер */
        .tap-btn {
            background-color: #1a2332;
            background-image: url('mellstroy.png');
            background-size: 130%; 
            background-position: calc(50% - 10px) 50%;
            background-repeat: no-repeat;
            
            border: 4px solid #00f2fe;
            border-radius: 50%;
            width: 220px;
            height: 220px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.2);
            transition: transform 0.05s ease, box-shadow 0.1s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        .tap-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }

        /* Вылетающая цифра +1 */
        .plus-one {
            position: absolute;
            font-size: 28px;
            font-weight: bold;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.8);
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-70px) scale(1.3);
            }
        }
    </style>
</head>
<body>

    <h2>БАЛАНС</h2>
    <div class="score" id="score">0</div>

    <div class="tap-btn" id="clickArea"></div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand();
        }

        // 1. Загружаем сохраненный баланс из память устройства
        let count = parseInt(localStorage.getItem('mell_score')) || 0;
        
        const scoreElement = document.getElementById('score');
        const clickArea = document.getElementById('clickArea');

        // Отображаем сохраненный баланс при запуске
        scoreElement.innerText = count;

        clickArea.addEventListener('click', (event) => {
            count++;
            scoreElement.innerText = count;

            // 2. Сохраняем новый баланс в памяти
            localStorage.setItem('mell_score', count);

            // Вибрация
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            } else if (navigator.vibrate) {
                navigator.vibrate(10);
            }

            // Анимация +1
            const plusOne = document.createElement('div');
            plusOne.classList.add('plus-one');
            plusOne.innerText = '+1';

            const rect = clickArea.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            plusOne.style.left = `${x}px`;
            plusOne.style.top = `${y}px`;

            clickArea.appendChild(plusOne);

            setTimeout(() => {
                plusOne.remove();
            }, 800);
