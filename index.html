<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MellTap</title>
    <script src="https://telegram.org/js/telegram-web-app.js?v=21"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0f12;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Шапка */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15px;
            width: 100%;
        }

        h2 {
            font-size: 13px;
            letter-spacing: 2px;
            color: #8a939e;
            margin-bottom: 2px;
        }

        .score {
            font-size: 36px;
            font-weight: bold;
            color: #00f2fe;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            margin-bottom: 5px;
        }

        /* Экраны */
        .tab-content {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: calc(100vh - 130px);
            overflow-y: auto;
            padding: 10px 20px;
        }

        .tab-content.active {
            display: flex;
        }

        /* Кнопка */
        .tap-btn {
            background-color: #1a2332;
            background-image: url('mellstroy.png');
            background-size: 130%; 
            background-position: calc(50% - 10px) 50%;
            background-repeat: no-repeat;
            border: 4px solid #00f2fe;
            border-radius: 50%;
            width: 230px;
            height: 230px;
            cursor: pointer;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.25);
            outline: none;
            position: relative;
            touch-action: manipulation;
            margin-top: 5px;
            transition: transform 0.1s ease;
        }

        .tap-btn:active {
            transform: scale(0.92);
        }

        /* Энергия */
        .energy-container {
            width: 280px;
            margin-top: 15px;
            background: rgba(26, 35, 50, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
        }

        .energy-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 13px;
            font-weight: bold;
            color: #8a939e;
            margin-bottom: 6px;
        }

        .energy-bar-bg {
            width: 100%;
            height: 10px;
            background-color: #0d0f12;
            border-radius: 5px;
            overflow: hidden;
            border: 2px solid #2a3b55;
            margin-bottom: 6px;
        }

        .energy-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #00ff87, #60efff);
            border-radius: 3px;
        }

        .energy-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            font-size: 12px;
            font-weight: bold;
        }

        .energy-regen {
            color: #00ff87;
        }

        .energy-timer {
            color: #8a939e;
        }

        /* Карточки */
        .card-list {
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .card {
            background: rgba(26, 35, 50, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .card-title {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
        }

        .card-desc {
            font-size: 11px;
            color: #8a939e;
        }

        .card-btn {
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            color: #0d0f12;
            font-weight: bold;
            font-size: 12px;
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
        }

        /* Меню навигации */
        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #151a21;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: #6b7683;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            width: 33%;
            padding: 8px 0;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-item.active {
            color: #00f2fe;
        }

        .plus-one {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.8);
            pointer-events: none;
            animation: floatUp 0.7s ease-out forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>БАЛАНС</h2>
        <div class="score" id="score">0</div>
    </div>

    <!-- Вкладка 1 -->
    <div class="tab-content active" id="tab-main">
        <div class="tap-btn" id="clickArea"></div>

        <div class="energy-container">
            <div class="energy-info">
                <span>⚡ ЭНЕРГИЯ</span>
                <span id="energyText">500 / 500</span>
            </div>
            <div class="energy-bar-bg">
                <div class="energy-bar-fill" id="energyBar"></div>
            </div>
            <div class="energy-footer">
                <div class="energy-regen">+1 / сек</div>
                <div class="energy-timer" id="energyTimer">Полный бак</div>
            </div>
        </div>
    </div>

    <!-- Вкладка 2 -->
    <div class="tab-content" id="tab-upgrades">
        <div class="card-list">
            <div class="card">
                <div class="card-info">
                    <div class="card-title">Мультитап</div>
                    <div class="card-desc">+1 балл за клик</div>
                </div>
                <button class="card-btn">100 🪙</button>
            </div>
            <div class="card">
                <div class="card-info">
                    <div class="card-title">Запас энергии</div>
                    <div class="card-desc">+500 к макс. энергии</div>
                </div>
                <button class="card-btn">200 🪙</button>
            </div>
        </div>
    </div>

    <!-- Вкладка 3 -->
    <div class="tab-content" id="tab-tasks">
        <div class="card-list">
            <div class="card">
                <div class="card-info">
                    <div class="card-title">Подписаться на канал</div>
                    <div class="card-desc">+1,000 монет</div>
                </div>
                <button class="card-btn">Выполнить</button>
            </div>
        </div>
    </div>

    <!-- Нижняя панель -->
    <div class="navbar">
        <div class="nav-item active" onclick="openTab('main', this)">
            <span>🏠</span>
            <span>Главная</span>
        </div>
        <div class="nav-item" onclick="openTab('upgrades', this)">
            <span>⚡</span>
            <span>Улучшения</span>
        </div>
        <div class="nav-item" onclick="openTab('tasks', this)">
            <span>📋</span>
            <span>Задания</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) { try { tg.expand(); } catch (e) {} }

        let count = 0;
        let energy = 500;
        const maxEnergy = 500;

        try {
            const savedScore = localStorage.getItem('mell_score');
            if (savedScore) count = parseInt(savedScore, 10);

            const savedEnergy = localStorage.getItem('mell_energy');
            if (savedEnergy) energy = parseInt(savedEnergy, 10);

            const lastTime = localStorage.getItem('mell_last_time');
            if (lastTime) {
                const passed = Math.floor(Date.now() / 1000) - parseInt(lastTime, 10);
                if (passed > 0) energy = Math.min(maxEnergy, energy + passed);
            }
        } catch (e) {}

        const scoreEl = document.getElementById('score');
        const clickArea = document.getElementById('clickArea');
        const energyText = document.getElementById('energyText');
        const energyBar = document.getElementById('energyBar');
        const energyTimer = document.getElementById('energyTimer');

        scoreEl.innerText = count;
        updateUI();

        // Переключение вкладок
        function openTab(name, element) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));

            document.getElementById('tab-' + name).classList.add('active');
            element.classList.add('active');

            try {
                if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
            } catch (e) {}
        }

        function saveGame() {
            try {
                localStorage.setItem('mell_score', count);
                localStorage.setItem('mell_energy', energy);
                localStorage.setItem('mell_last_time', Math.floor(Date.now() / 1000));
            } catch (e) {}
        }

        function updateUI() {
            scoreEl.innerText = count;
            energyText.innerText = energy + ' / ' + maxEnergy;
            energyBar.style.width = (energy / maxEnergy * 100) + '%';

            if (energy >= maxEnergy) {
                energyTimer.innerText = "Полный бак";
            } else {
                const left = maxEnergy - energy;
                const m = Math.floor(left / 60).toString().padStart(2, '0');
                const s = (left % 60).toString().padStart(2, '0');
                energyTimer.innerText = m + ':' + s;
            }
        }

        function spawnPlus(x, y) {
            const rect = clickArea.getBoundingClientRect();
            const div = document.createElement('div');
            div.className = 'plus-one';
            div.innerText = '+1';
            div.style.left = (x - rect.left) + 'px';
            div.style.top = (y - rect.top) + 'px';
            clickArea.appendChild(div);
            setTimeout(() => div.remove(), 700);
        }

        // Клик по кнопке (поддержка мыши и тач-скринов)
        clickArea.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (energy <= 0) {
                try { if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy'); } catch(err){}
                return;
            }

            count++;
            energy--;
            updateUI();
            saveGame();
            spawnPlus(e.clientX, e.clientY);

            try {
                if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                else if (navigator.vibrate) navigator.vibrate(10);
            } catch (err) {}
        });

        // Восстановление энергии каждую секунду
        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 1);
                updateUI();
                saveGame();
            }
        }, 1000);
    </script>
</body>
</html>
