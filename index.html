<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MellTap</title>
    <script src="https://telegram.org/js/telegram-web-app.js?v=19"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0d0f12;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Шапка с балансом (отображается всегда) */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            width: 100%;
        }

        h2 {
            font-size: 14px;
            letter-spacing: 2px;
            color: #8a939e;
            margin: 0 0 4px 0;
        }

        .score {
            font-size: 38px;
            font-weight: bold;
            color: #00f2fe;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            margin-bottom: 10px;
        }

        /* Основные экраны/вкладки */
        .tab-content {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: calc(100vh - 160px);
            overflow-y: auto;
            padding: 10px 20px;
        }

        .tab-content.active {
            display: flex;
        }

        /* --- ВКЛАДКА: ГЛАВНАЯ --- */
        .tap-btn {
            background-color: #1a2332;
            background-image: url('mellstroy.png');
            background-size: 130%; 
            background-position: calc(50% - 10px) 50%;
            background-repeat: no-repeat;
            border: 4px solid #00f2fe;
            border-radius: 50%;
            width: 240px;
            height: 240px;
            cursor: pointer;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.25);
            outline: none;
            position: relative;
            touch-action: none;
            margin-top: 10px;
        }

        .tap-btn.animate {
            animation: tapPunch 0.15s ease forwards;
        }

        @keyframes tapPunch {
            0% { transform: scale(1); }
            50% { transform: scale(0.88); }
            100% { transform: scale(1); }
        }

        .energy-container {
            width: 280px;
            margin-top: 20px;
            background: rgba(26, 35, 50, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(5px);
        }

        .energy-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 13px;
            font-weight: bold;
            color: #8a939e;
            margin-bottom: 8px;
        }

        .energy-bar-bg {
            width: 100%;
            height: 12px;
            background-color: #0d0f12;
            border-radius: 6px;
            overflow: hidden;
            border: 2px solid #2a3b55;
            margin-bottom: 8px;
        }

        .energy-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #00ff87, #60efff);
            border-radius: 4px;
            transition: width 0.2s linear;
        }

        .energy-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            font-size: 12px;
            font-weight: bold;
        }

        .energy-regen {
            color: #00ff87;
            text-shadow: 0 0 8px rgba(0, 255, 135, 0.4);
        }

        .energy-timer {
            color: #8a939e;
        }

        /* --- ВКЛАДКИ: УЛУЧШЕНИЯ И ЗАДАНИЯ (Карточки) --- */
        .card-list {
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .card {
            background: rgba(26, 35, 50, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-title {
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
        }

        .card-desc {
            font-size: 12px;
            color: #8a939e;
        }

        .card-btn {
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            color: #0d0f12;
            font-weight: bold;
            font-size: 13px;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
            outline: none;
        }

        /* --- НИЖНЕЕ МЕНЮ НАВИГАЦИИ (BOTTOM BAR) --- */
        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: #151a21;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 200;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #6b7683;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s ease;
            width: 33%;
        }

        .nav-item .icon {
            font-size: 20px;
        }

        .nav-item.active {
            color: #00f2fe;
        }

        .plus-one {
            position: absolute;
            font-size: 28px;
            font-weight: bold;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.8);
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-70px) scale(1.3);
            }
        }
    </style>
</head>
<body>

    <!-- Шапка приложения -->
    <div class="header">
        <h2>БАЛАНС</h2>
        <div class="score" id="score">0</div>
    </div>

    <!-- Вкладка 1: Главная -->
    <div class="tab-content active" id="tab-main">
        <div class="tap-btn" id="clickArea"></div>

        <div class="energy-container">
            <div class="energy-info">
                <span>⚡ ЭНЕРГИЯ</span>
                <span id="energyText">500 / 500</span>
            </div>
            <div class="energy-bar-bg">
                <div class="energy-bar-fill" id="energyBar"></div>
            </div>
            <div class="energy-footer">
                <div class="energy-regen">+1 / сек</div>
                <div class="energy-timer" id="energyTimer">Полный бак</div>
            </div>
        </div>
    </div>

    <!-- Вкладка 2: Улучшения -->
    <div class="tab-content" id="tab-upgrades">
        <div class="card-list">
            <div class="card">
                <div class="card-info">
                    <div class="card-title">Мультитап</div>
                    <div class="card-desc">+1 балл за каждый клик</div>
                </div>
                <button class="card-btn">100 🪙</button>
            </div>
            <div class="card">
                <div class="card-info">
                    <div class="card-title">Запас энергии</div>
                    <div class="card-desc">+500 к макс. энергии</div>
                </div>
                <button class="card-btn">200 🪙</button>
            </div>
            <div class="card">
                <div class="card-info">
                    <div class="card-title">Авто-Бот</div>
                    <div class="card-desc">Тапает пока ты оффлайн</div>
                </div>
                <button class="card-btn">1000 🪙</button>
            </div>
        </div>
    </div>

    <!-- Вкладка 3: Задания -->
    <div class="tab-content" id="tab-tasks">
        <div class="card-list">
            <div class="card">
                <div class="card-info">
                    <div class="card-title">Подписаться на канал</div>
                    <div class="card-desc">+1,000 монет</div>
                </div>
                <button class="card-btn">Выполнить</button>
            </div>
            <div class="card">
                <div class="card-info">
                    <div class="card-title">Пригласить друга</div>
                    <div class="card-desc">+2,500 монет</div>
                </div>
                <button class="card-btn">Пригласить</button>
            </div>
        </div>
    </div>

    <!-- Нижняя навигация -->
    <div class="navbar">
        <div class="nav-item active" onclick="switchTab('main', this)">
            <span class="icon">🏠</span>
            <span>Главная</span>
        </div>
        <div class="nav-item" onclick="switchTab('upgrades', this)">
            <span class="icon">⚡</span>
            <span>Улучшения</span>
        </div>
        <div class="nav-item" onclick="switchTab('tasks', this)">
            <span class="icon">📋</span>
            <span>Задания</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            try { tg.expand(); } catch (e) {}
        }

        let count = 0;
        let energy = 500;
        const maxEnergy = 500;

        try {
            const savedScore = localStorage.getItem('mell_score');
            if (savedScore !== null && !isNaN(savedScore)) {
                count = parseInt(savedScore, 10);
            }
            const savedEnergy = localStorage.getItem('mell_energy');
            if (savedEnergy !== null && !isNaN(savedEnergy)) {
                energy = parseInt(savedEnergy, 10);
            }

            const lastTime = localStorage.getItem('mell_last_time');
            if (lastTime !== null) {
                const now = Math.floor(Date.now() / 1000);
                const secondsPassed = now - parseInt(lastTime, 10);
                if (secondsPassed > 0) {
                    energy = Math.min(maxEnergy, energy + secondsPassed);
                }
            }
        } catch (e) {}

        const scoreElement = document.getElementById('score');
        const clickArea = document.getElementById('clickArea');
        const energyText = document.getElementById('energyText');
        const energyBar = document.getElementById('energyBar');
        const energyTimer = document.getElementById('energyTimer');

        scoreElement.innerText = count;
        updateEnergyUI();

        // Переключение вкладок
        function switchTab(tabName, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));

            document.getElementById(`tab-${tabName}`).classList.add('active');
            element.classList.add('active');

            try {
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.selectionChanged();
                }
            } catch (e) {}
        }

        function saveState() {
            try {
                const now = Math.floor(Date.now() / 1000);
                localStorage.setItem('mell_score', count.toString());
                localStorage.setItem('mell_energy', energy.toString());
                localStorage.setItem('mell_last_time', now.toString());
            } catch (e) {}
        }

        function updateEnergyUI() {
            energyText.innerText = `${energy} / ${maxEnergy}`;
            const percent = (energy / maxEnergy) * 100;
            energyBar.style.width = `${percent}%`;

            if (energy >= maxEnergy) {
                energyTimer.innerText = "Полный бак";
            } else {
                const secondsLeft = maxEnergy - energy;
                const minutes = Math.floor(secondsLeft / 60);
                const seconds = secondsLeft % 60;
                const formattedTime = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                energyTimer.innerText = formattedTime;
            }
        }

        function triggerVibration(type = 'light') {
            try {
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred(type);
                } else if (navigator.vibrate) {
                    navigator.vibrate(10);
                }
            } catch (e) {}
        }

        function triggerAnimation() {
            clickArea.classList.remove('animate');
            void clickArea.offsetWidth;
            clickArea.classList.add('animate');
        }

        function spawnPlusOne(clientX, clientY) {
            const rect = clickArea.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            const plus
