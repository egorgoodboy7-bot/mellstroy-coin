<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MellTap</title>
    <script src="https://telegram.org/js/telegram-web-app.js?v=20"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0f12;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Шапка с балансом */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            width: 100%;
        }

        h2 {
            font-size: 14px;
            letter-spacing: 2px;
            color: #8a939e;
            margin-bottom: 4px;
        }

        .score {
            font-size: 38px;
            font-weight: bold;
            color: #00f2fe;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            margin-bottom: 10px;
        }

        /* Экраны вкладок */
        .tab-content {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: calc(100vh - 150px);
            overflow-y: auto;
            padding: 10px 20px;
        }

        .tab-content.active {
            display: flex;
        }

        /* Кнопка-кликер */
        .tap-btn {
            background-color: #1a2332;
            background-image: url('mellstroy.png');
            background-size: 130%; 
            background-position: calc(50% - 10px) 50%;
            background-repeat: no-repeat;
            border: 4px solid #00f2fe;
            border-radius: 50%;
            width: 240px;
            height: 240px;
            cursor: pointer;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.25);
            outline: none;
            position: relative;
            touch-action: none;
            margin-top: 10px;
        }

        .tap-btn.animate {
            animation: tapPunch 0.15s ease forwards;
        }

        @keyframes tapPunch {
            0% { transform: scale(1); }
            50% { transform: scale(0.88); }
            100% { transform: scale(1); }
        }

        /* Карточка шкалы энергии */
        .energy-container {
            width: 280px;
            margin-top: 15px;
            background: rgba(26, 35, 50, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(5px);
        }

        .energy-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 13px;
            font-weight: bold;
            color: #8a939e;
            margin-bottom: 8px;
        }

        .energy-bar-bg {
            width: 100%;
            height: 12px;
            background-color: #0d0f12;
            border-radius: 6px;
            overflow: hidden;
            border: 2px solid #2a3b55;
            margin-bottom: 8px;
        }

        .energy-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #00ff87, #60efff);
            border-radius: 4px;
            transition: width 0.2s linear;
        }

        .energy-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            font-size: 12px;
            font-weight: bold;
        }

        .energy-regen {
            color: #00ff87;
            text-shadow: 0 0 8px rgba(0, 255, 135, 0.4);
        }

        .energy-timer {
            color: #8a939e;
        }

        /* Карточки улучшения и заданий */
        .card-list {
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .card {
            background: rgba(26, 35, 50, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-title {
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
        }

        .card-desc {
            font-size: 12px;
            color: #8a939e;
        }

        .card-btn {
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            color: #0d0f12;
            font-weight: bold;
            font-size: 13px;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
            outline: none;
        }

        /* Нижняя навигация */
        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: #151a21;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: #6b7683;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            width: 33%;
            padding: 8px 0;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-item .icon {
            font-size: 18px;
        }

        .nav-item.active {
            color: #00f2fe;
        }

        .plus-one {
            position: absolute;
            font-size: 28px;
            font-weight: bold;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.8);
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-70px) scale(1.3);
            }
        }
    </style>
</head>
<body>

    <!-- Шапка приложения -->
    <div class="header">
        <h2>БАЛАНС</h2>
        <div class="score" id="score">0</div>
    </div>

    <!-- Вкладка 1: Главная -->
    <div class="tab-content active" id="tab-main">
        <div class="tap-btn" id="clickArea"></div>

        <div class="energy-container">
            <div class="energy-info">
                <span>⚡ ЭНЕРГИЯ</span>
                <span id="energyText">500 / 500</span>
            </div>
            <div class="energy-bar-bg">
                <div class="energy-bar-fill" id="energyBar"></div>
            </div>
            <div class="energy-footer">
                <div class="energy-regen">+1 / сек</div>
                <div class="energy-timer" id="energyTimer">Полный бак</div>
            </div>
        </div>
    </div>

    <!-- Вкладка 2: Улучшения -->
    <div class="tab-content" id="tab-upgrades">
        <div class="card-list">
            <div class="card">
                <div class="card-info">
                    <div class="card-title">Мультитап</div>
                    <div class="card-desc">+1 балл за каждый клик</div>
                </div>
                <button class="card-btn">100 🪙</button>
            </div>
            <div class="card">
                <div class="card-info">
                    <div class="card-title">Запас энергии</div>
                    <div class="card-desc">+500 к макс. энергии</div>
                </div>
                <button class="card-btn">200 🪙</button>
            </div>
        </div>
    </div>

    <!-- Вкладка 3: Задания -->
    <div class="tab-content" id="tab-tasks">
        <div class="card-list">
            <div class="card">
                <div class="card-info">
                    <div class="card-title">Подписаться на канал</div>
                    <div class="card-desc">+1,000 монет</div>
                </div>
                <button class="card-btn">Выполнить</button>
            </div>
        </div>
    </div>

    <!-- Нижняя навигация -->
    <div class="navbar">
        <div class="nav-item active" id="btn-nav-main">
            <span class="icon">🏠</span>
            <span>Главная</span>
        </div>
        <div class="nav-item" id="btn-nav-upgrades">
            <span class="icon">⚡</span>
            <span>Улучшения</span>
        </div>
        <div class="nav-item" id="btn-nav-tasks">
            <span class="icon">📋</span>
            <span>Задания</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            try { tg.expand(); } catch (e) {}
        }

        let count = 0;
        let energy = 500;
        const maxEnergy = 500;

            if (savedEnergy !== null && !isNaN(savedEnergy)) {
                energy = parseInt(savedEnergy, 10);
            }

            const lastTime = localStorage.getItem('mell_last_time');
            if (lastTime !== null) {
