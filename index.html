<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MellTap</title>
    <!-- Подключаем скрипт Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0d0f12;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        h2 {
            font-size: 18px;
            letter-spacing: 2px;
            color: #8a939e;
            margin-bottom: 5px;
        }

        .score {
            font-size: 48px;
            font-weight: bold;
            color: #00f2fe;
            margin-bottom: 40px;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        /* Кнопка-кликер */
        .tap-btn {
            background-color: #1a2332;
            background-image: url('mellstroy.png');
            background-size: 130%; 
            background-position: calc(50% - 10px) 50%;
            background-repeat: no-repeat;
            
            border: 4px solid #00f2fe;
            border-radius: 50%;
            width: 220px;
            height: 220px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.2);
            transition: transform 0.05s ease, box-shadow 0.1s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .tap-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }
    </style>
</head>
<body>

    <h2>БАЛАНС</h2>
    <div class="score" id="score">0</div>

    <div class="tap-btn" id="clickArea"></div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand(); // Разворачиваем окно на весь экран
        }

        let count = 0;
        const scoreElement = document.getElementById('score');
        const clickArea = document.getElementById('clickArea');

        clickArea.addEventListener('click', () => {
            count++;
            scoreElement.innerText = count;

            // Вызываем легкую вибрацию Telegram HapticFeedback
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            } else if (navigator.vibrate) {
                // Запасной вариант для обычных браузеров
                navigator.vibrate(10);
            }
        });
    </script>
</body>
</html>
