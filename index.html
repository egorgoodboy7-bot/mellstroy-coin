<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MellTap</title>
    <script src="https://telegram.org/js/telegram-web-app.js?v=6"></script>
    <style>
        body {
            background-color: #0d0f12;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        h2 {
            font-size: 18px;
            letter-spacing: 2px;
            color: #8a939e;
            margin-bottom: 5px;
        }

        .score {
            font-size: 48px;
            font-weight: bold;
            color: #00f2fe;
            margin-bottom: 40px;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        .tap-btn {
            background-color: #1a2332;
            background-image: url('mellstroy.png');
            background-size: 130%; 
            background-position: calc(50% - 10px) 50%;
            background-repeat: no-repeat;
            
            border: 4px solid #00f2fe;
            border-radius: 50%;
            width: 220px;
            height: 220px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.2);
            transition: transform 0.05s ease, box-shadow 0.1s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            touch-action: manipulation;
        }

        .tap-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }

        .plus-one {
            position: absolute;
            font-size: 28px;
            font-weight: bold;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.8);
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-70px) scale(1.3);
            }
        }
    </style>
</head>
<body>

    <h2>БАЛАНС</h2>
    <div class="score" id="score">0</div>

    <div class="tap-btn" id="clickArea"></div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            try { tg.expand(); } catch (e) {}
        }

        // Безопасное считывание баланса из localStorage
        let count = 0;
        try {
            const saved = localStorage.getItem('mell_score');
            if (saved !== null && !isNaN(saved)) {
                count = parseInt(saved, 10);
            }
        } catch (e) {
            console.log("Ошибка чтения localStorage:", e);
        }

        const scoreElement = document.getElementById('score');
        const clickArea = document.getElementById('clickArea');

        // Выводим начальный баланс
        scoreElement.innerText = count;

        function handleTap(event) {
            count++;
            scoreElement.innerText = count;

            // Сохранение баланса
            try {
                localStorage.setItem('mell_score', count.toString());
            } catch (e) {}

            // Вибрация
            try {
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('light');
                } else if (navigator.vibrate) {
                    navigator.vibrate(10);
                }
            } catch (e) {}

            // Координаты клика/тапа для "+1"
            const rect = clickArea.getBoundingClientRect();
            let clientX = event.clientX;
            let clientY = event.clientY;

            if (event.touches && event.touches.length > 0) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
            } else if (!clientX && !clientY) {
                clientX = rect.left + rect.width / 2;
                clientY = rect.top + rect.height / 2;
            }

            const x = clientX - rect.left;
            const y = clientY - rect.top;

            // Вылетающая цифра "+1"
            const plusOne = document.createElement('div');
            plusOne.classList.add('plus-one');
            plusOne.innerText = '+1';
            plusOne.style.left = `${x}px`;
            plusOne.style.top = `${y}px`;

            clickArea.appendChild(plusOne);

            setTimeout(() => {
                plusOne.remove();
            }, 800);
        }

        // Поддержка кликов и тапов
        clickArea.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            handleTap(e);
        });
    </script>
</body>
</html>
