<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MellTap</title>
    <script src="https://telegram.org/js/telegram-web-app.js?v=11"></script>
    <style>
        body {
            background-color: #0d0f12;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 35px;
            height: 100vh;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        h2 {
            font-size: 16px;
            letter-spacing: 2px;
            color: #8a939e;
            margin-bottom: 5px;
        }

        .score {
            font-size: 42px;
            font-weight: bold;
            color: #00f2fe;
            margin-bottom: 25px;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        /* Кнопка с плавной анимацией */
        .tap-btn {
            background-color: #1a2332;
            background-image: url('mellstroy.png');
            background-size: 130%; 
            background-position: calc(50% - 10px) 50%;
            background-repeat: no-repeat;
            
            border: 4px solid #00f2fe;
            border-radius: 50%;
            width: 260px;
            height: 260px;
            cursor: pointer;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.25);
            outline: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            touch-action: none;
            /* Плавный переход для сжатия и тени */
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.1s ease;
        }

        /* Состояние при нажатии */
        .tap-btn.pressed, .tap-btn:active {
            transform: scale(0.90);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }

        .plus-one {
            position: absolute;
            font-size: 28px;
            font-weight: bold;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.8);
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-70px) scale(1.3);
            }
        }
    </style>
</head>
<body>

    <h2>БАЛАНС</h2>
    <div class="score" id="score">0</div>

    <div class="tap-btn" id="clickArea"></div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            try { tg.expand(); } catch (e) {}
        }

        let count = 0;
        try {
            const saved = localStorage.getItem('mell_score');
            if (saved !== null && !isNaN(saved)) {
                count = parseInt(saved, 10);
            }
        } catch (e) {
            console.log("Ошибка чтения localStorage:", e);
        }

        const scoreElement = document.getElementById('score');
        const clickArea = document.getElementById('clickArea');

        scoreElement.innerText = count;

        function saveScore() {
            try {
                localStorage.setItem('mell_score', count.toString());
            } catch (e) {}
        }

        function triggerVibration() {
            try {
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('light');
                } else if (navigator.vibrate) {
                    navigator.vibrate(10);
                }
            } catch (e) {}
        }

        function spawnPlusOne(clientX, clientY) {
            const rect = clickArea.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            const plusOne = document.createElement('div');
            plusOne.classList.add('plus-one');
            plusOne.innerText = '+1';
            plusOne.style.left = `${x}px`;
            plusOne.style.top = `${y}px`;

            clickArea.appendChild(plusOne);

            setTimeout(() => {
                plusOne.remove();
            }, 800);
        }

        // Обработка касаний (смартфоны)
        clickArea.addEventListener('touchstart', (e) => {
            e.preventDefault();
            clickArea.classList.add('pressed');

            const touches = Array.from(e.changedTouches).slice(0, 4);

            touches.forEach((touch) => {
                count++;
                spawnPlusOne(touch.clientX, touch.clientY);
            });

            scoreElement.innerText = count;
            saveScore();
            triggerVibration();
        }, { passive: false });

        // Мягкий возврат кнопки в исходное положение с небольшой задержкой, чтобы анимация успевала проиграться
        function releaseButton() {
            setTimeout(() => {
                clickArea.classList.remove('pressed');
            }, 80);
        }

        clickArea.addEventListener('touchend', releaseButton);
        clickArea.addEventListener('touchcancel', releaseButton);

        // Резерв для ПК (мышка)
        clickArea.addEventListener('mousedown', (e) => {
            if (!('ontouchstart' in window)) {
                count++;
                scoreElement.innerText = count;
                spawnPlusOne(e.clientX, e.clientY);
                saveScore();
                triggerVibration();
            }
        });
    </script>
</body>
</html>
